name: ci

on:
  push:
    branches: ["main", "Pro777/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install site dependencies
        run: npm ci

      - name: Verify generated Tailwind CSS
        run: npm run check:css

      - name: Validate static artifacts
        run: ./scripts/validate_site.sh
